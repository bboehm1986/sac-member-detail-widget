<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AE Member Detail — local preview</title>
<style>
  body { margin: 0; padding: 20px; background: #eef1f4; font-family: Arial, sans-serif; }
  h2 { font-family: Arial, sans-serif; color: #333; }
  button { margin-bottom: 12px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  com-porticobenefits-memberdetail { display: block; width: 900px; height: 480px; }
</style>
</head>
<body>
<h2>AE Member Detail — standalone preview (mock data, exercises the real SAC widget lifecycle hooks)</h2>
<button id="toggle">Toggle mock: selected member</button>
<com-porticobenefits-memberdetail id="widget"></com-porticobenefits-memberdetail>

<script src="main.js"></script>
<script>
  // Drive the widget the same way SAC would: call the lifecycle hooks with
  // changedProperties. Real Input Control filtering can't be simulated
  // standalone, so this button swaps between the two mock ResultSets
  // baked into main.js to exercise both render states.
  const widget = document.getElementById("widget");
  widget.onCustomWidgetBeforeUpdate({ width: 900, height: 480 });
  widget.onCustomWidgetAfterUpdate({ width: 900, height: 480 });

  const WidgetClass = customElements.get("com-porticobenefits-memberdetail");
  let selected = false;
  document.getElementById("toggle").addEventListener("click", () => {
    selected = !selected;
    const data = selected ? WidgetClass.MOCK_MEMBER_SELECTED : WidgetClass.MOCK_MEMBER_LIST;
    widget.onCustomWidgetAfterUpdate({ memberDetail: data });
  });
</script>
</body>
</html>
